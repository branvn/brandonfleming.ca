baseURL = "https://brandonfleming.ca/"
languageCode = "en-ca"
title = "Brandon Fleming"
enableRobotsTXT = true
enableGitInfo = false

# Drafts are hidden in production builds. Use `hugo server -D` to preview them.
buildDrafts = false
buildFuture  = false

summaryLength = 30

[params]
  # --- Identity -------------------------------------------------------------
  fullName = "Brandon Fleming"
  tagline  = "Urban Studies Graduate Student | GIS & Policy Analysis"
  location = "Surrey, British Columbia"
  email    = "contact@brandonfleming.ca"
  phone    = "778-228-0051"
  linkedin = "https://www.linkedin.com/in/brandon-fleming-/"
  resume   = "/documents/brandon-fleming-resume.pdf"

  # Third-party pages that are demonstrably about you. These feed the "sameAs"
  # list in the structured data, which is how a search engine tells one Brandon
  # Fleming from another. Add an ORCID here once you have one: it is the proper
  # fix for name collisions and it matters most once the thesis is deposited.
  profiles = [
    "https://orcid.org/0009-0000-0925-2317",
    "https://www.kpu.ca/stories/policy-studies/brandon-fleming",
  ]

  # Header marginalia: the coordinate block in the top right corner.
  #
  # Store DECIMAL DEGREES here, not degrees-minutes-seconds. The template
  # (layouts/partials/dms.html) does the conversion, so a number pasted straight
  # out of ArcGIS Pro goes in as-is. Writing DMS by hand meant escaping the
  # seconds mark as \" inside a TOML string, which is one typo away from a
  # broken build.
  #
  # South and West are NEGATIVE. Every value needs a decimal point so Hugo reads
  # it as a float; scripts/check_site.py enforces both of those.
  #
  # Any page can override all three in its own front matter, and most do. These
  # are only the fallback for pages that set nothing, like 404.
  #
  # Blackie Spit, Crescent Beach. A public park, deliberately not an address.
  lat  =   49.05922
  lng  = -122.88261
  elev =    2.0

  # The bounding box of assets/img/plate.svg, which is generated by
  # scripts/make_plate.py from the same FRAME. The header uses this to tell
  # whether the coordinates it is showing fall on the map behind them. Change
  # one of these and you must change the other; check_site.py compares them.
  #
  # Written as a one-line inline table on purpose. A [params.frame] header here
  # would swallow every key below it into that table instead of into params.
  frame = { west = -123.354, east = -122.356, south = 49.003, north = 49.403 }

  # --- SEO ------------------------------------------------------------------
  description = "Urban studies graduate researcher and GIS analyst in Metro Vancouver. Spatial analysis of housing policy, agricultural land use, and BC's Bill 44."
  ogImage = "/images/og-default.png"

  # --- Feature switches -----------------------------------------------------
  # Flip to true to put the whole site behind a holding page.
  underConstruction = false
  # Flip to true once the Bill 44 tracker has real entries in it.
  showTracker = false

[menu]
  [[menu.main]]
    name = "Work"
    pageRef = "/work"
    weight = 10
  [[menu.main]]
    name = "Writing"
    pageRef = "/writing"
    weight = 20
  [[menu.main]]
    name = "Photography"
    pageRef = "/photography"
    weight = 30
  [[menu.main]]
    name = "About"
    pageRef = "/about"
    weight = 40

[markup]
  [markup.goldmark.renderer]
    unsafe = true          # allows raw HTML (iframes for ArcGIS StoryMaps)
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3

[taxonomies]
  tag = "tags"

[imaging]
  quality = 84
  resampleFilter = "Lanczos"

[minify]
  minifyOutput = true

[permalinks]
  writing = "/writing/:slug/"

[outputs]
  home = ["HTML", "RSS"]
