    keywords:
      - "ssmuh"
      - "small-scale multi-unit"
      - "small scale multi unit"
      - "houseplex"
      - "garden suite"
      - "coach house"
      - "bill 44"
      - "transit-oriented area"
      - "transit oriented area"
      - "inclusionary"

  - name: "City of Surrey: Corporate Reports"
    jurisdiction: "Surrey"
    type: "council"
    mode: "drupal"
    match: "document"
    url: "https://www.surrey.ca/city-government/council-meetings/corporate-reports"
    keywords:
      - "ssmuh"
      - "small-scale multi-unit"
      - "houseplex"
      - "bill 44"
      - "bill 25"
      - "transit-oriented area"
      - "transit oriented area"
