# Sources for the Bill 44 tracker.
#
# mode: "rss" : a real feed. Reliable, cheap, preferred.
# mode: "html" : scrape links off a page. Fragile; verify occasionally.
#
# IMPORTANT: only headline, link, and date are ever stored. Never store article
# body text: that is someone else's copyright.

keywords:
  - "bill 44"
  - "ssmuh"
  - "small-scale multi-unit"
  - "small scale multi unit"
  - "housing statutes amendment"
  - "bill 25"
  - "upzoning"
  - "upzone"
  - "multiplex"
  - "fourplex"
  - "sixplex"
  - "restricted zone"
  - "infill housing"
  - "transit-oriented area"
  - "official community plan"
  - "zoning bylaw amendment"

sources:
  # --- Municipal council agendas ------------------------------------------
  - name: "City of Surrey: Corporate Reports"
    jurisdiction: "Surrey"
    type: "council"
    mode: "html"
    url: "https://www.surrey.ca/city-government/council-meetings/corporate-reports"

  - name: "City of Surrey: Planning Reports"
    jurisdiction: "Surrey"
    type: "council"
    mode: "html"
    url: "https://www.surrey.ca/city-government/council-meetings/planning-reports"

  # --- Regional and provincial news (RSS) ---------------------------------
