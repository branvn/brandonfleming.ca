name: Bill 44 tracker

# Runs in GitHub's cloud, not on your laptop, so it keeps working whether or
# not your machine is on. Commits new candidates back to the repo.
#
# Candidates land with an empty `note`. They do NOT appear on the site until
# you write that note yourself and push.

on:
  schedule:
    - cron: "0 17 * * 5"     # Fridays, 17:00 UTC (10:00 Pacific)
  workflow_dispatch:          # lets you run it on demand from the Actions tab
    inputs:
      test_notify:
        description: "Send a Telegram message even if nothing new was found"
        type: boolean
        default: false

# Without this the job can only read the repo, and the push below fails.
# It was dropped once during a rewrite and the failure only shows up a week
# later, in a log nobody is watching.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Poll sources
        id: scrape
        run: |
          OUTPUT=$(python scripts/track_bill44.py)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "^0 new candidate(s)"; then
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_new=true" >> "$GITHUB_OUTPUT"
          fi

          # Set unconditionally. Reading it only inside the else branch meant a
          # forced test notification arrived with a blank where the count goes.
          PENDING=$(echo "$OUTPUT" | grep -oP '\d+(?= awaiting your note)' | tail -1)
          echo "pending=${PENDING:-0}" >> "$GITHUB_OUTPUT"

          # The candidate lines this run produced, newest scoring first. Written
          # to a file rather than a step output because outputs choke on
          # multiline values.
          echo "$OUTPUT" | sed -n '/new candidate(s)\./,$p' | sed '1d' \
            | grep -v '^Wrote ' | head -n 20 > /tmp/new_candidates.txt
          echo "--- candidates captured for notification ---"
          cat /tmp/new_candidates.txt

      # Deliberately NOT gated on has_new. A run can evaluate new documents,
      # match none of them, and still change tracker_cache.json. Skipping the
      # commit in that case throws the cache away and re-downloads every Surrey
      # PDF next week.
      #
      # [skip ci] stops Cloudflare rebuilding. Safe here because everything this
      # job adds is unreviewed and therefore invisible on the site. Remove it if
      # you ever want the "last checked" date to refresh on its own.
      - name: Commit any new candidates
        run: |
          if git diff --quiet -- data/tracker.json scripts/tracker_cache.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "bill44-tracker"
          git config user.email "actions@github.com"
          git add data/tracker.json scripts/tracker_cache.json
          git commit -m "tracker: new candidates $(date -u +%Y-%m-%d) [skip ci]"
          git push

      # Sends only when something new turned up. Silence means nothing matched.
      # Tick "test_notify" when running by hand to fire one regardless, which is
      # the only way to check the token and chat id are right before the first
      # real hit arrives.
      - name: Notify on Telegram
        if: steps.scrape.outputs.has_new == 'true' || inputs.test_notify
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          PENDING: ${{ steps.scrape.outputs.pending }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "Telegram secrets not set, skipping notification."
            exit 0
          fi

          # Prefer what this run actually turned up. Falling back to the whole
          # review queue only matters for a forced test, because otherwise every
          # weekly message would replay the same backlog until it was annotated.
          BODY=$(cat /tmp/new_candidates.txt 2>/dev/null)
          if [ -z "$BODY" ]; then
            BODY=$(python scripts/track_bill44.py --review | head -n 24)
            HEADLINE="Bill 44 tracker: nothing new. ${PENDING} still awaiting your note."
          else
            HEADLINE="Bill 44 tracker: new documents. ${PENDING} awaiting your note."
          fi

          MESSAGE=$(printf '%s\n\n%s' "$HEADLINE" "$BODY")

          # --data-urlencode, not -d: the message contains newlines, and -d
          # would send them raw and mangle the request.
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true" \
            -o /dev/null
