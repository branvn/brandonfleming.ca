name: Bill 44 Tracker

on:
  schedule:
    - cron: '0 17 * * 5' # Runs every Friday at 10:00 AM PDT (17:00 UTC)
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  poll-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run tracker scraper
        id: scrape
        run: |
          # Run the script and capture the output to determine if there are new candidates
          OUTPUT=$(python scripts/track_bill44.py)
          echo "$OUTPUT"
          
          # Check if the output contains "0 new candidate(s)"
          if echo "$OUTPUT" | grep -q "0 new candidate(s)"; then
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            echo "has_new=true" >> $GITHUB_OUTPUT
            
            # Extract the number of pending items for the notification
            PENDING=$(echo "$OUTPUT" | grep -oP '\d+(?= awaiting your note)')
            echo "pending=$PENDING" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.scrape.outputs.has_new == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tracker.json scripts/tracker_cache.json
          git commit -m "chore(tracker): automated weekly polling [skip ci]"
          git push

      - name: Send Telegram Alert
        if: steps.scrape.outputs.has_new == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="<b>Bill 44 Tracker</b>%0AFound new municipal documents. You have ${PENDING} entries awaiting review in tracker.json."
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d parse_mode="HTML"
