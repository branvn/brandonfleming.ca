name: Bill 44 tracker

# Runs in GitHub's cloud, not on your laptop — so it keeps working whether or
# not your machine is on. Commits new candidates back to the repo; Cloudflare
# Pages then rebuilds automatically.
#
# Candidates land with an empty `note`. They do NOT appear on the site until
# you write that note yourself and push.

on:
  schedule:
    - cron: "0 14 * * 1"      # Mondays, 14:00 UTC (~6am Pacific)
  workflow_dispatch:           # lets you run it on demand from the Actions tab

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Poll sources
        run: python scripts/track_bill44.py

      # scripts/tracker_cache.json records every document already fetched,
      # including the ones that matched nothing. It has to be committed too, or
      # the runner throws it away and every weekly run re-downloads every Surrey
      # PDF from scratch. It lives in scripts/ rather than data/ because Hugo
      # parses everything in data/ on every build, and this file is the
      # scraper's business, not the website's.
      - name: Commit any new candidates
        run: |
          if git diff --quiet -- data/tracker.json scripts/tracker_cache.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "bill44-tracker"
          git config user.email "actions@github.com"
          git add data/tracker.json scripts/tracker_cache.json
          git commit -m "tracker: new candidates $(date -u +%Y-%m-%d)"
          git push
