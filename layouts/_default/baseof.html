<!DOCTYPE html>
<html lang="en-CA">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ block "bodyclass" . }}{{ end }}">

  {{ partial "background.html" . }}

  {{ if site.Params.underConstruction }}
    {{ partial "construction.html" . }}
  {{ end }}

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="shell">
    {{ partial "header.html" . }}

    <main id="main">
      {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}
  </div>

</body>
</html>
