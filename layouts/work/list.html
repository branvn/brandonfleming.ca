{{ define "main" }}
  <header class="page-head">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="page-intro">{{ . }}</div>{{ end }}
  </header>

  <h2 class="visually-hidden">Projects</h2>
  <div class="cards">
    {{ range .Pages.ByParam "weight" }}
      {{ partial "work-card.html" . }}
    {{ end }}
  </div>
{{ end }}
